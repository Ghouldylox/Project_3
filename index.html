<!DOCTYPE html> 
 
<html> 
 
<head> 
 
 <meta charset="utf-8"> 
 
 <title>My A-Frame World</title> 
 
 <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
 <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

 
</head> 
 
<body> 
 
<a-assets>
  <img 
  id="stars" 
  src="images/shell.jpg">
  <a-asset-item 
  id="cat" 
  src="images/lowpoly_toro_kuro.glb"></a-asset-item>
</a-assets>

 <a-scene>
  <a-gltf-model
    src="#cat"
    position="0 1 -3"
    scale="10 10 10"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
  </a-gltf-model>

  <a-box
    position="0 1 -3"
    material="src: #stars">
  </a-box>
  
</a-scene>
 
   <!-- <a-plane 
     position="0 0 -4" 
     rotation="-90 0 0" 
     width="10" 
     height="10" 
     color="#ff6a00"> 
   </a-plane>  -->
 
   <a-sky color="#241b2f"></a-sky> 

<a-entity environment="
  active: true;
  preset: egypt;
  dressingColor:#0f1fff;
  ground:hills;
  groundYScale:10;
  skyColor:#0f1fff;
  horizonColor:#110063;
  "></a-entity>

   <!-- <material="color:#0f1fff"></material>
<a-box position="0.684 1.597 -0.491" color="#ff2a8a" material="color: #0f1fff" rotation="-0.6302535746439055 -167.87663397333122 2.1199438419840457" scale="-0.682 -0.672 1.279"> 
   </a-box> -->
 
 </a-scene> 
 
</body> 
 
</html>
